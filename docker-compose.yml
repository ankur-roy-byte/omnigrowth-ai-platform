version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:?set DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-campuscatalyst}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:?set DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - TEMPORAL_SERVICE_ADDRESS=temporal:7233
      - SECURITY_ADMIN_USERNAME=${SECURITY_ADMIN_USERNAME:-admin}
      - SECURITY_ADMIN_PASSWORD=${SECURITY_ADMIN_PASSWORD:?set SECURITY_ADMIN_PASSWORD}
      - SECURITY_API_USERNAME=${SECURITY_API_USERNAME:-api}
      - SECURITY_API_PASSWORD=${SECURITY_API_PASSWORD:?set SECURITY_API_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-campuscatalyst}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  temporal:
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PWD=${DB_PASSWORD:?set DB_PASSWORD}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  temporal-ui:
    image: temporalio/ui:2.26.2
    ports:
      - "8081:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
